{{range $id, $item := .}}
<div class="bg-white p-6 rounded-lg shadow-md flex items-start justify-between" id="item-{{$item.ID}}">
    <div class="flex-1">
        <h3 class="text-lg font-semibold">{{$item.Name}}</h3>
        <p class="text-gray-600 mt-2">{{$item.Description}}</p>
        {{if $item.ImagePath}}
        <img src="{{$item.ImagePath}}" alt="{{$item.Name}}" class="mt-4 max-w-xs rounded-lg">
        {{end}}
    </div>
    <button class="ml-4 text-red-600 hover:text-red-800"
            hx-delete="/items/{{$item.ID}}"
            hx-target="#items-list"
            hx-swap="innerHTML">
        Delete
    </button>
</div>
{{else}}
<div class="bg-white p-6 rounded-lg shadow-md text-center text-gray-500">
    No items yet. Add your first item above!
</div>
{{end}}
